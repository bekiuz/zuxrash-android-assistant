name: Build Zuxrash AI APK

on:
  push:
    paths:
      - 'zuxrash-android-assistant-source.zip'
      - 'app/**'
      - '**.kt'
      - '*.gradle.kts'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check source archive
        run: test -f zuxrash-android-assistant-source.zip

      - name: Extract Android Studio project
        run: unzip -q zuxrash-android-assistant-source.zip -d imported-source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle -p imported-source/zuxrash-android-assistant --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zuxrash-ai-debug-apk
          path: imported-source/zuxrash-android-assistant/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
